[project]
name = "portfolio-risk"
version = "0.1.0"
description = "Risikoanalyse für Portfolios: VaR, Monte-Carlo und Stresstests auf Basis echter Kursdaten"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
